<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Pro Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top, #243b55, #0b1020 55%, #05070d);
      font-family: Arial, sans-serif;
      color: white;
    }

    .calculator {
      width: 360px;
      padding: 22px;
      border-radius: 28px;
      background: rgba(20, 27, 45, 0.92);
      box-shadow:
        0 25px 60px rgba(0,0,0,.6),
        inset 0 1px 1px rgba(255,255,255,.12);
      transform: perspective(900px) rotateX(3deg);
    }

    .title {
      text-align: center;
      margin-bottom: 18px;
    }

    .title h1 {
      font-size: 25px;
      letter-spacing: 2px;
    }

    .title p {
      color: #8ea4c7;
      font-size: 12px;
      margin-top: 5px;
    }

    .display {
      height: 105px;
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 18px;
      background: #070b14;
      box-shadow:
        inset 0 8px 20px rgba(0,0,0,.7),
        0 4px 12px rgba(0,0,0,.4);
      text-align: right;
      overflow: hidden;
    }

    #expression {
      height: 30px;
      color: #8294ad;
      font-size: 16px;
    }

    #result {
      margin-top: 8px;
      font-size: 34px;
      font-weight: bold;
      color: #fff;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;

      background: linear-gradient(145deg, #27344e, #111827);

      box-shadow:
        5px 5px 10px rgba(0,0,0,.45),
        -3px -3px 8px rgba(255,255,255,.04),
        inset 0 1px 1px rgba(255,255,255,.08);

      transition: .15s;
    }

    button:active {
      transform: translateY(4px) scale(.97);
      box-shadow: inset 3px 3px 8px rgba(0,0,0,.5);
    }

    .operator {
      background: linear-gradient(145deg, #344c70, #18263d);
    }

    .danger {
      background: linear-gradient(145deg, #8d3030, #4d1717);
    }

    .equal {
      grid-column: span 2;
      background: linear-gradient(145deg, #2676ff, #123d91);
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <div class="title">
      <h1>3D PRO</h1>
      <p>ADVANCED CALCULATOR</p>
    </div>

    <div class="display">
      <div id="expression"></div>
      <div id="result">0</div>
    </div>

    <div class="buttons">

      <button class="danger" onclick="clearDisplay()">AC</button>
      <button onclick="deleteLast()">⌫</button>
      <button onclick="addValue('%')">%</button>
      <button class="operator" onclick="addValue('/')">÷</button>

      <button onclick="addValue('7')">7</button>
      <button onclick="addValue('8')">8</button>
      <button onclick="addValue('9')">9</button>
      <button class="operator" onclick="addValue('*')">×</button>

      <button onclick="addValue('4')">4</button>
      <button onclick="addValue('5')">5</button>
      <button onclick="addValue('6')">6</button>
      <button class="operator" onclick="addValue('-')">−</button>

      <button onclick="addValue('1')">1</button>
      <button onclick="addValue('2')">2</button>
      <button onclick="addValue('3')">3</button>
      <button class="operator" onclick="addValue('+')">+</button>

      <button class="zero" onclick="addValue('0')">0</button>
      <button onclick="addValue('.')">.</button>

      <button class="equal" onclick="calculate()">=</button>

    </div>

  </div>

<script>
  let expression = "";

  const expressionBox = document.getElementById("expression");
  const resultBox = document.getElementById("result");

  function addValue(value) {
    expression += value;
    expressionBox.textContent = expression;
  }

  function clearDisplay() {
    expression = "";
    expressionBox.textContent = "";
    resultBox.textContent = "0";
  }

  function deleteLast() {
    expression = expression.slice(0, -1);
    expressionBox.textContent = expression;
  }

  function calculate() {
    try {
      if (!expression) return;

      const safeExpression = expression.replace(/%/g, "/100");

      const answer = Function(
        '"use strict"; return (' + safeExpression + ')'
      )();

      if (!Number.isFinite(answer)) {
        throw new Error();
      }

      resultBox.textContent = answer;
    } catch {
      resultBox.textContent = "Error";
    }
  }

  document.addEventListener("keydown", function(event) {

    if (
      /[0-9+\-*/.%]/.test(event.key)
    ) {
      addValue(event.key);
    }

    if (event.key === "Enter") {
      calculate();
    }

    if (event.key === "Backspace") {
      deleteLast();
    }

    if (event.key === "Escape") {
      clearDisplay();
    }

  });
</script>

</body>
</html>
